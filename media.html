<!-- Media (Sean, 2026-11-01: "this section, I think, should turn to media... all the stuff I've produced... all of it can be
     just filterable"): /media lists what Sean produced, filtered by type: the networks and their shows, series (From Blur to
     Blueprint) and books (Pre-Vegans), each the Directory's tile from the same sar-directory record; Events when there are
     any. /watch addresses forward here (vercel.json).
     Watch, the Vegans Explore way (Sean, 2026-11-01: "Vegans Explore, TopSpot USA, Anime 3000. And then when you click those,
     you should see the shows that are underneath it... a thumbnail, then the name of the show... then you get the profile with
     all the episodes... 3/4 where the body of the information is, and then you have 1/4 for ads... the same way it shows on
     Vegans Explore when you click on a podcast... even how the audio plays").
       /media                     what Sean produced, by type (the networks first)
       /media/<network>           its shows as tiles (vercel.json rewrites to this page)
       /media/<network>/<show>    a show: a podcast plays through Vegans Explore's own episode player (ve-episodes.js, the bar at
                                  the foot of the window); a playlist (TopSpot USA) or a channel (A3K TV) plays like Brooke
                                  Sellers' series pages: the video up top, every video below.
     Data: sar-media watch / show / episodes (sar_watch_networks, sar_watch_shows; feeds re-read hourly by the sar-media-refresh
     cron) and ve-youtube playlist (re-read every 6 hours). Ads: Vegans Explore's ve-ad-rail.js, brand sean-a-russell, page
     sar-watch. The featured clips Sean picks for his kits are still managed at /media/manage. -->
<style>
  :root{--bg:#fff;--ink:#1a1a1a;--ink2:#55524e;--ink3:#8a8580;--line:#1a1a1a;--hair:rgba(26,26,26,.12);--orange:#F69820;--orange-ink:#7d4a00;--orange-wash:#fdf2e3;--dark:#0d0d0d;--font:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--font)}
  img{max-width:100%}
  .wrap{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:14px}
  .brand{font-weight:900;font-size:16px;text-transform:uppercase;text-decoration:none;color:inherit}
  .brand span{color:var(--orange)}
  .nav nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.1em}
  .nav nav a{text-decoration:none;color:inherit}
  .btn{display:inline-flex;align-items:center;justify-content:center;font:800 11px/1 var(--font);text-transform:uppercase;letter-spacing:.1em;padding:12px 16px;border-radius:6px;background:var(--orange);color:#1a1a1a !important;border:1.5px solid var(--orange);text-decoration:none;white-space:nowrap;cursor:pointer}
  .btn.ghost{background:#fff;border-color:var(--line)}
  .head{background:var(--dark);color:#fff;padding-block:36px;display:grid;gap:10px}
  .head.withart{grid-template-columns:150px minmax(0,1fr);gap:24px;align-items:center}
  .head .art{width:150px;aspect-ratio:1;border-radius:6px;object-fit:cover;background:#222}
  .head .art.wide{aspect-ratio:16/9;object-fit:contain;background:#000}
  .head > div{display:grid;gap:10px;min-width:0}
  .eyebrow{font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange)}
  .eyebrow a{color:inherit;text-decoration:none}.eyebrow a:hover{text-decoration:underline}
  h1{font-weight:900;font-size:clamp(28px,5vw,52px);line-height:1;text-transform:uppercase;letter-spacing:-.02em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
  .head p{margin:0;color:rgba(255,255,255,.8);max-width:66ch}
  .facts{display:flex;flex-wrap:wrap;gap:6px}
  .fact{font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:6px;background:rgba(255,255,255,.1);color:#fff}
  .fact.on{background:var(--orange);color:#1a1a1a}
  /* A show's header and sections follow a Vegans Explore listing page (vegansexplore.com directory/listing.html): the path in
     the header, pill badges, then About, Listen on (square icons) and Episodes. The header stays black until Sean picks a
     background (2026-11-01: "leave it black for now, but I do want to put something there"). */
  .path{font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.7)}
  .path a{color:var(--orange);text-decoration:none}.path a:hover{text-decoration:underline}
  .pill{font-weight:800;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:var(--orange);color:#1a1a1a}
  .pill.line{background:none;border:1.5px solid var(--orange);color:var(--orange)}
  .pill.dim{background:none;border:1.5px solid rgba(255,255,255,.35);color:rgba(255,255,255,.85)}
  .sec{margin:0 0 26px}
  .sec-t{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--orange-wash)}
  .icons{display:flex;flex-wrap:wrap;gap:12px}
  .icon{display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;text-decoration:none;color:var(--ink)}
  .icon span{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid var(--hair);background:#fff;transition:.15s}
  .icon span img{width:28px;height:28px}
  .icon:hover span{border-color:var(--orange);transform:translateY(-1px)}
  .icon:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:12px}
  .icon small{font-size:10.5px;font-weight:700;text-align:center;line-height:1.25;color:var(--ink2)}
  /* The player sits above the episodes and changes with each Play (Vegans Explore's .vep-dock[data-vep-always]). */
  #vep-player.docked{border-color:var(--orange) !important}
  .body{padding-block:22px 56px}
  .vear-layout{--ve-nav-h:var(--navh,0px)}
  h2{font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px}
  /* Networks and shows are the Directory's own tiles (assets/js/sar-dir-card.js), three across beside the ad rail. */
  @media (min-width:1201px){.vear-main .sard-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (min-width:901px) and (max-width:1200px){.vear-main .sard-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  /* The three networks as tabs (Sean, 2026-11-01: "a tab where you can go between those three things"). */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px;padding-bottom:14px;border-bottom:1px solid var(--hair)}
  .tabs a{font:700 12px/1 var(--font);padding:10px 13px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);text-decoration:none}
  .tabs a[aria-current=page]{background:var(--ink);color:#fff}
  .tabs a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  .about{max-width:72ch;margin:0 0 12px;color:var(--ink2);white-space:pre-line}
  .about.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .more{background:none;border:0;padding:0;font:800 11px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--orange-ink);cursor:pointer;margin:0}
  .muted{color:var(--ink3);font-style:italic}
  /* The video show: the player up top, every video under it (Brooke Sellers' series pages). */
  /* A video plays in a window over the page (Brooke Sellers' series pages); the list stays three across. */
  .lb{position:fixed;inset:0;z-index:9995;background:rgba(0,0,0,.94);display:grid;place-items:center;padding:20px}
  .lb[hidden]{display:none}
  .lb-in{width:min(1100px,100%);display:grid;gap:10px}
  .lb-frame{position:relative;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden}
  .lb-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .lb-t{margin:0;color:#fff;font-weight:800;font-size:16px;line-height:1.3}
  .lb-x{justify-self:end;background:none;border:1.5px solid rgba(255,255,255,.6);color:#fff;border-radius:6px;font:800 11px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;padding:10px 12px;cursor:pointer}
  .lb-x:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  .vids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .vid{display:grid;gap:6px;text-align:left;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
  .vid .th{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#111}
  .vid .th img{width:100%;height:100%;object-fit:cover;display:block}
  .vid .dur{position:absolute;right:6px;bottom:6px;font:700 11px/1 var(--font);padding:4px 5px;border-radius:4px;background:rgba(0,0,0,.8);color:#fff}
  .vid b{font-weight:700;font-size:13.5px;line-height:1.35}
  .vid small{font-size:11.5px;color:var(--ink3);font-weight:600}
  .vid:hover b{text-decoration:underline}
  .vid:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
  .gfs-frame{border-radius:6px;overflow:hidden;background:#020c0a;border:1px solid var(--hair)}
  .gfs-frame iframe{display:block;width:100%;height:760px;border:0}
  .head[hidden]{display:none}
  .gfs-strip{display:flex;align-items:center;gap:12px;padding:0 0 14px;margin-bottom:14px;border-bottom:1px solid var(--hair)}
  .gfs-logo{width:40px;height:40px;object-fit:contain;flex-shrink:0}
  .gfs-id{display:grid;gap:3px;min-width:0;flex:1}
  .gfs-path{font-weight:800;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
  .gfs-path a{color:var(--orange-ink);text-decoration:none}.gfs-path a:hover{text-decoration:underline}
  .gfs-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.gfs-name b{font-weight:900;font-size:20px;text-transform:uppercase;letter-spacing:-.01em;line-height:1.1}
  .gfs-open{font:800 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--orange-ink);text-decoration:none;white-space:nowrap}
  .gfs-open:hover{text-decoration:underline}
  @media (max-width:480px){.gfs-open{display:none}}
  .vcount{margin:0 0 12px;font-size:12.5px;font-weight:700;color:var(--ink2)}
  .showall{margin-top:20px;display:flex;justify-content:center}
  footer{border-top:1px solid var(--hair);padding-block:22px;font-size:12px;color:var(--ink3)}
  /* Vegans Explore's player, in Sean's colors. */
  .vep-btn.go,.vep-pages button[aria-current=page]{background:var(--orange) !important;border-color:var(--orange) !important;color:#1a1a1a !important}
  a.vep-t:hover,.vep-crumb button{color:var(--orange-ink) !important}
  .vear-ph{background:var(--orange-wash) !important;color:var(--orange-ink) !important}
  .vear-cta{color:var(--orange-ink) !important}
  @media (max-width:1100px){.vids{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:640px){.nav{position:static}.head.withart{grid-template-columns:1fr}.head .art{width:120px}.head .art.wide{width:100%;max-width:360px}}
  @media (max-width:480px){.vids{grid-template-columns:1fr}}
</style>

</header>

  </div>
</div>

<script>
(function () {
  var FN = 'https://fwbhwfxpncrsfhttimna.supabase.co/functions/v1/';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Ymh3ZnhwbmNyc2ZodHRpbW5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjAxMzksImV4cCI6MjA5MDIzNjEzOX0.9mxjK0bn5WATCbNLWrHPakD6yHUDtHFHrOaklPnWkOA';
  var head = document.getElementById('head'), main = document.getElementById('main');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  // Speed (Sean, 2026-11-01: "I click the watch section, it's just loading"): every answer is kept in this browser for a day.
  // A page you have seen draws at once from that copy while a fresh one is fetched for next time; the first visit waits.
  var DAY = 864e5;
  function fn(name, action, body) {
    var url = FN + name + (action ? '?action=' + action : ''), payload = JSON.stringify(body || {}), key = 'sarw:' + name + ':' + action + ':' + payload, hit = null;
    var live = fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ANON, apikey: ANON }, body: payload })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {} return d; });
    try { hit = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) {}
    if (hit && Date.now() - hit.t < DAY) { live.catch(function () {}); return Promise.resolve(hit.d); }
    return live;
  }
  var media = function (action, body) { return fn('sar-media', action, body); };
  function when(d) { var t = Date.parse(d || ''); return isNaN(t) ? '' : new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
  function len(s) {
    if (typeof s === 'string') return s;
    if (!s) return '';
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function status(s) { return s.active == null ? '' : s.active ? 'Active' : 'On hiatus'; }
  function count(s) { return s.count == null ? '' : plural(s.count, s.kind === 'podcast' ? 'episode' : 'video', s.kind === 'podcast' ? 'episodes' : 'videos'); }
  function setHead(html, art, wide) {
    head.hidden = false;
    head.className = 'head wrap' + (art ? ' withart' : '');
    head.innerHTML = (art ? '<img class="art' + (wide ? ' wide' : '') + '" src="' + esc(art) + '" alt="">' : '') + '<div>' + html + '</div>';
  }
  function notFound(what) {
    setHead('<span class="eyebrow">Media</span><h1>Not found</h1>');
    main.innerHTML = '<p class="muted">That ' + what + ' is not in Media. <a href="/media">See everything</a>.</p>';
  }
  function failed() { main.innerHTML = '<p class="muted">This did not load. Refresh to try again.</p>'; }
  // The rail sticks just under the menu.
  function navH() { var n = document.getElementById('nav'); document.documentElement.style.setProperty('--navh', getComputedStyle(n).position === 'sticky' ? n.offsetHeight + 'px' : '0px'); }
  navH(); addEventListener('resize', navH);

  var parts = location.pathname.replace(/\/+$/, '').split('/').slice(2).filter(Boolean);
  if (!parts.length) networks(); else if (parts.length === 1) network(parts[0]); else show(parts[0], parts[1]);

  // The Directory's records (sar-directory list): a network and a show in Media are the same entries, drawn with the same tile.
  var dirP = null;
  function directory() {
    var t = null; try { t = localStorage.getItem('lr_token'); } catch (e) {}
    return dirP || (dirP = fn('sar-directory', 'list', { token: t }).then(function (d) {
      var by = {}; ((d && d.items) || []).forEach(function (i) { by[i.slug] = i; }); return { by: by, key: (d && d.key) || {} };
    }).catch(function () { return { by: {}, key: {} }; }));
  }
  SARDir.css();
  // A show's tile: its Directory entry when it has one; a TopSpot USA playlist or A3K TV, which are not separate Directory
  // entries, takes the same tile from its own cover and roles.
  function showTile(n, s, dir) {
    var it = dir.by[s.slug] ? Object.assign({}, dir.by[s.slug]) : { slug: s.slug, name: s.name, kind: s.kind === 'podcast' ? 'podcast' : 'youtube', logo: s.cover, roles: s.roles || [] };
    if (s.kind !== 'podcast' || !it.logo) it.logo = it.logo || s.cover;
    if (s.kind !== 'podcast') it.kind = 'youtube';
    it.extra = s.active == null ? [] : [[s.active ? 'Active' : 'On hiatus', s.active ? 'on' : '']];
    return SARDir.card(it, { key: dir.key, href: '/media/' + n.slug + '/' + s.slug, sub: [s.kind === 'podcast' ? 'Podcast' : 'Video', count(s)].filter(Boolean).join(' · ') });
  }
  // An artist (GeekFon Society): the same tile, the artist's square photo, their genre as the pill and their tagline.
  function artistTile(n, a) {
    return SARDir.card({ slug: a.slug, name: a.name, kind: 'podcast', logo: a.cover, tagline: a.about, roles: [], extra: a.genre ? [[a.genre, '']] : [] },
      { href: '/media/' + n.slug + '/' + a.slug, sub: '' });
  }
  function netItem(n, dir) { return Object.assign({ slug: n.slug, name: n.name, kind: 'brand', logo: n.logo, tagline: n.tagline }, dir.by[n.slug] || {}); }

  // ---- /media ----
  // What Sean produced, by type (Sean, 2026-11-01: "the different types of things I've produced... all of it can be just
  // filterable"), the Directory's tiles. A type shows once it has something in it; the address keeps the type (?type=).
  // Sean, 2026-11-01: "put pre-vegans and from blur to blueprint in a category called book series... let's just say networks".
  var TYPES = [['all', 'All'], ['networks', 'Networks'], ['books', 'Book series'], ['event', 'Events']];
  function networks() {
    setHead('<span class="eyebrow">Media</span><h1>What Sean produced</h1><p>The networks and everything on them, and the book series and everything they spawn. Pick a type, or open one to see everything in it.</p>');
    var type = new URLSearchParams(location.search).get('type') || 'all';
    Promise.all([media('watch', {}), directory()]).then(function (r) {
      var nets = (r[0] && r[0].networks) || [], dir = r[1], items = Object.keys(dir.by).map(function (k) { return dir.by[k]; });
      var groups = {
        networks: nets.map(function (n) { return SARDir.card(netItem(n, dir), { key: dir.key, href: '/media/' + n.slug, sub: plural(n.shows, 'show', 'shows') }); }),
      };
      var tile = function (i) { return SARDir.card(i, { key: dir.key, href: i.page, sub: '' }); };
      // A book series is the book and everything it spawns (videos, clips, chapters): From Blur to Blueprint and Pre-Vegans.
      groups.books = items.filter(function (i) { return (i.kind === 'series' || i.kind === 'book') && i.page; }).map(tile);
      groups.event = items.filter(function (i) { return i.kind === 'event' && i.page; }).map(tile);
      var avail = TYPES.filter(function (t) { return t[0] === 'all' || (groups[t[0]] || []).length; });
      if (!avail.some(function (t) { return t[0] === type; })) type = 'all';
      function draw() {
        main.innerHTML = '<nav class="tabs" aria-label="Type">' + avail.map(function (t) {
            return '<a href="/media' + (t[0] === 'all' ? '' : '?type=' + t[0]) + '" data-type="' + t[0] + '"' + (t[0] === type ? ' aria-current="page"' : '') + '>' + esc(t[1]) + '</a>';
          }).join('') + '</nav>' +
          avail.filter(function (t) { return t[0] !== 'all' && (type === 'all' || type === t[0]); }).map(function (t) {
            return '<section class="sec"><h2 class="sec-t">' + esc(t[1]) + '</h2>' + SARDir.grid(groups[t[0]].join('')) + '</section>';
          }).join('');
      }
      main.onclick = function (e) {
        var a = e.target.closest('.tabs a[data-type]'); if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
        e.preventDefault(); type = a.getAttribute('data-type'); history.replaceState(null, '', a.getAttribute('href')); draw();
      };
      if (!nets.length && !items.length) return failed();
      draw();
    }).catch(failed);
  }

  // ---- /media/<network> ----
  // The three networks are tabs: switching one redraws the page in place and keeps the address.
  var NETS = null;
  function network(slug, push) {
    Promise.all([media('watch', { network: slug }), NETS || media('watch', {}), directory()]).then(function (r) {
      var d = r[0], dir = r[2]; NETS = Promise.resolve(r[1]);
      if (!d || !d.network) return notFound('network');
      var n = d.network, shows = d.shows || [], item = netItem(n, dir), roles = (item.relationship || []).concat(item.roles || []);
      if (push) history.pushState(null, '', '/media/' + n.slug);
      document.title = n.name + '. Media. Sean A. Russell.';
      setHead('<span class="path"><a href="/media">Media</a> / ' + esc(n.name) + '</span><h1>' + esc(n.name) + '</h1>' + (n.tagline ? '<p>' + esc(n.tagline) + '</p>' : '') +
        (roles.length ? '<div class="facts">' + roles.map(function (x) { return '<span class="fact">' + esc(x) + '</span>'; }).join('') + '</div>' : ''), n.logo, true);
      main.innerHTML = '<nav class="tabs" aria-label="Networks">' + ((r[1] && r[1].networks) || []).map(function (x) {
          return '<a href="/media/' + esc(x.slug) + '" data-net="' + esc(x.slug) + '"' + (x.slug === n.slug ? ' aria-current="page"' : '') + '>' + esc(x.name) + '</a>';
        }).join('') + '</nav>' +
        (n.kind === 'artists'
          ? '<h2 class="sec-t">' + esc(plural(shows.length, 'artist', 'artists')) + '</h2>' + SARDir.grid(shows.map(function (a) { return artistTile(n, a); }).join(''))
          : '<h2 class="sec-t">' + esc(plural(shows.length, 'show', 'shows')) + '</h2>' + SARDir.grid(shows.map(function (s) { return showTile(n, s, dir); }).join('')));
    }).catch(failed);
  }
  main.addEventListener('click', function (e) {
    var t = e.target.closest('.tabs a[data-net]'); if (!t || e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault(); if (t.getAttribute('aria-current')) return; network(t.getAttribute('data-net'), true);
  });
  addEventListener('popstate', function () {
    var p = location.pathname.replace(/\/+$/, '').split('/').slice(2).filter(Boolean);
    if (p.length === 1) network(p[0]); else if (!p.length) networks();
  });

  // ---- /media/<network>/<show> ----
  function show(net, slug) {
    media('watch', { network: net }).then(function (w) {
      if (w && w.network && w.network.kind === 'artists') {
        var a = (w.shows || []).filter(function (x) { return x.slug === slug; })[0];
        return a ? artist(w.network, a) : notFound('artist');
      }
      showPage(net, slug);
    }).catch(function () { showPage(net, slug); });
  }

  // An artist: their own geekfon.ai page, inside this one (Sean, 2026-11-01: "I basically want that page on here, because you can
  // listen to their music and then you can join and support them"). GeekFon draws it in its embedded mode (?embed=1): no GeekFon
  // header, its height sent here so the frame grows, and Join, Support and every link open on geekfon.ai in the whole window.
  var GFS = 'https://geekfon.ai';
  // No black header here (Sean, 2026-11-01: "we don't need the black header because the information's already in the embed"):
  // a slim strip with GeekFon's logo, the path, the artist's name a size smaller and their genre, then their page.
  function artist(n, a) {
    document.title = a.name + '. ' + n.name + '. Sean A. Russell.';
    head.hidden = true; head.innerHTML = '';
    var url = GFS + '/' + encodeURIComponent(a.slug);
    main.innerHTML = '<div class="gfs-strip">' + (n.logo ? '<img class="gfs-logo" src="' + esc(n.logo) + '" alt="' + esc(n.name) + '">' : '') +
        '<div class="gfs-id"><span class="gfs-path"><a href="/media">Media</a> / <a href="/media/' + esc(n.slug) + '">' + esc(n.name) + '</a> / ' + esc(a.name) + '</span>' +
        '<span class="gfs-name"><b>' + esc(a.name) + '</b>' + (a.genre ? '<span class="sard-pill">' + esc(a.genre) + '</span>' : '') + '</span></div>' +
        '<a class="gfs-open" href="' + url + '" target="_blank" rel="noopener">Open on geekfon.ai</a></div>' +
      '<div class="gfs-frame"><iframe id="gfs" src="' + url + '?embed=1" title="' + esc(a.name) + ' on GeekFon Society" ' +
      'allow="autoplay; encrypted-media; fullscreen; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>';
    var f = document.getElementById('gfs'); f.onload = hostViewport;
  }
  // The frame lays its page out to this window's height (not its own, which grows to fit the page).
  function hostViewport() {
    var f = document.getElementById('gfs'); if (!f || !f.contentWindow) return;
    var navh = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--navh'), 10) || 0;
    f.contentWindow.postMessage({ type: 'gfs-host-viewport', height: Math.max(420, innerHeight - navh - 24) }, GFS);
  }
  addEventListener('resize', hostViewport);
  addEventListener('message', function (e) {
    if (e.origin !== GFS || !e.data) return;
    if (e.data.type === 'gfs-embed-ready') return hostViewport();
    if (e.data.type !== 'gfs-embed-height') return;
    var f = document.getElementById('gfs'); var h = Math.round(+e.data.height);
    if (f && h > 200 && h < 30000) f.style.height = h + 'px';
  });

  function showPage(net, slug) {
    media('show', { slug: slug }).then(function (d) {
      if (!d || !d.show || !d.network || d.network.slug !== net) return notFound('show');
      var s = d.show, n = d.network;
      document.title = s.name + '. ' + n.name + '. Sean A. Russell.';
      var pills = '<span class="pill">' + (s.kind === 'podcast' ? 'Podcast' : 'Video') + '</span>' +
        (s.active == null ? '' : '<span class="pill ' + (s.active ? '' : 'line') + '">' + (s.active ? 'Active' : 'On hiatus') + '</span>') +
        (count(s) ? '<span class="pill dim">' + esc(count(s)) + '</span>' : '') + (s.latest ? '<span class="pill dim">Latest ' + esc(when(s.latest)) + '</span>' : '');
      setHead('<span class="path"><a href="/media">Media</a> / <a href="/media/' + esc(n.slug) + '">' + esc(n.name) + '</a> / ' + esc(s.name) + '</span>' +
        '<h1>' + esc(s.name) + '</h1><div class="facts">' + pills + '</div>' +
        (s.roles && s.roles.length ? '<p>Sean: ' + esc(s.roles.join(', ')) + '</p>' : ''), s.cover, s.kind !== 'podcast');
      var ICON = { 'Website': 'website', 'Spotify': 'spotify', 'Apple Podcasts': 'apple-podcasts', 'Amazon Music': 'amazon-music', 'YouTube': 'youtube', 'RSS feed': 'rss' };
      main.innerHTML = (s.about ? '<div class="sec"><h2 class="sec-t">About</h2><p class="about clip" id="about">' + esc(s.about) + '</p><button class="more" type="button" id="more" hidden>Read more</button></div>' : '') +
        (s.listen_on && s.listen_on.length ? '<div class="sec"><h2 class="sec-t">' + (s.kind === 'podcast' ? 'Listen on' : 'Watch on') + '</h2><div class="icons">' +
          s.listen_on.map(function (l) {
            return '<a class="icon" href="' + esc(l.url) + '" target="_blank" rel="noopener" aria-label="' + esc(l.label) + '"><span><img src="/assets/img/platforms/' + (ICON[l.label] || 'website') + '.svg" alt="" width="28" height="28"></span><small>' + esc(l.label) + '</small></a>';
          }).join('') + '</div></div>' : '') +
        '<div class="sec"><h2 class="sec-t">' + (s.kind === 'podcast' ? 'Episodes' : 'Videos') + '</h2>' + (s.kind === 'podcast' ? '<div class="vep-dock" data-vep-always></div>' : '') +
        '<div id="eps"><p class="muted">Loading the episodes.</p></div></div>';
      var ab = document.getElementById('about'), more = document.getElementById('more');
      if (ab && ab.scrollHeight > ab.clientHeight + 2) { more.hidden = false; more.onclick = function () { ab.classList.remove('clip'); more.hidden = true; }; }
      var box = document.getElementById('eps');
      if (s.kind === 'podcast') podcast(box, s);
      else if (s.kind === 'playlist') fn('ve-youtube', '', { action: 'playlist', id: s.playlist_id }).then(function (p) {
        videos(box, ((p && p.videos) || []).map(function (v) { return { id: v.id, title: v.title, date: v.published, thumb: v.thumb, dur: v.duration }; }), null);
      }).catch(function () { box.innerHTML = '<p class="muted">The videos did not load. Refresh to try again.</p>'; });
      else channel(box, s);
    }).catch(failed);
  }

  // A podcast: Vegans Explore's own episode list and player (search, 20 a page, ?ep= for one episode, the bar at the foot).
  function podcast(box, s) {
    var go = function () {
      VEEpisodes.mount(box, {
        listing: { id: s.slug, slug: s.slug, name: s.name, logo_url: s.cover || '' },
        call: function (body) { return media(body.action, body); },
      });
    };
    if (window.VEEpisodes) return go();
    var sc = document.createElement('script'); sc.src = 'https://vegansexplore.com/public/ve-episodes.js'; sc.onload = go;
    sc.onerror = function () { box.innerHTML = '<p class="muted">The player did not load. Refresh to try again.</p>'; };
    document.body.appendChild(sc);
  }

  // A channel (A3K TV): its uploads from sar-media. The first 50 draw at once; the rest follow behind.
  function channel(box, s) {
    var all = [], total = 0, view = null;
    function map(d) {
      return ((d && d.episodes) || []).filter(function (e) { return e.youtube_id; }).map(function (e) {
        return { id: e.youtube_id, title: e.title, date: e.date, thumb: e.image, dur: e.duration };
      });
    }
    function rest(offset) {
      if (offset >= total) return;
      media('episodes', { listing_id: s.slug, offset: offset, limit: 50 }).then(function (d) { all.push.apply(all, map(d)); view.more(); rest(offset + 50); }).catch(function () {});
    }
    media('episodes', { listing_id: s.slug, offset: 0, limit: 50 }).then(function (d) {
      total = (d && d.total) || 0; all = map(d); view = videos(box, all, total); rest(50);
    }).catch(function () { box.innerHTML = '<p class="muted">The videos did not load. Refresh to try again.</p>'; });
  }

  // The video show: every video three across under Videos, newest first, 12 and then Show all. A video plays in a window over
  // the page (Sean, 2026-11-01: "don't put the first one big... have them in the three column underneath the video section").
  function videos(box, list, total) {
    if (!list.length) { box.innerHTML = '<p class="muted">No videos yet.</p>'; return { more: function () {} }; }
    var open = false, SHOW = 12;
    function card(v) {
      return '<button type="button" class="vid" data-id="' + esc(v.id) + '"><span class="th">' +
        (v.thumb ? '<img src="' + esc(v.thumb) + '" alt="" loading="lazy">' : '') + (v.dur ? '<span class="dur">' + esc(len(v.dur)) + '</span>' : '') + '</span>' +
        '<b>' + esc(v.title) + '</b><small>' + esc(when(v.date)) + '</small></button>';
    }
    function draw() {
      var shown = open ? list : list.slice(0, SHOW), n = total || list.length;
      box.innerHTML = '<p class="vcount">' + esc(plural(n, 'video', 'videos')) + '</p><div class="vids">' + shown.map(card).join('') + '</div>' +
        (!open && n > SHOW ? '<div class="showall"><button type="button" class="btn ghost" id="all">Show all ' + n + ' videos</button></div>' : '');
      var a = document.getElementById('all'); if (a) a.onclick = function () { open = true; draw(); };
    }
    box.addEventListener('click', function (e) {
      var b = e.target.closest('.vid'); if (!b) return;
      var v = list.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0]; if (v) lightbox(v, b);
    });
    draw();
    return { more: function () { if (open) draw(); } };
  }
  var lb = null, lbFrom = null;
  function lightbox(v, from) {
    if (!lb) {
      lb = document.createElement('div'); lb.className = 'lb'; lb.hidden = true; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true'); lb.setAttribute('aria-label', 'Video player');
      lb.innerHTML = '<div class="lb-in"><button type="button" class="lb-x">Close</button><div class="lb-frame"></div><p class="lb-t"></p></div>';
      document.body.appendChild(lb);
      lb.addEventListener('click', function (e) { if (e.target === lb || e.target.closest('.lb-x')) closeLb(); });
      addEventListener('keydown', function (e) { if (e.key === 'Escape' && lb && !lb.hidden) closeLb(); });
    }
    lbFrom = from;
    lb.querySelector('.lb-frame').innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v.id) + '?autoplay=1&rel=0" title="' + esc(v.title) + '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
    lb.querySelector('.lb-t').textContent = v.title + (v.date ? '  ·  ' + when(v.date) : '');
    lb.hidden = false; document.body.style.overflow = 'hidden'; lb.querySelector('.lb-x').focus();
  }
  function closeLb() {
    lb.hidden = true; lb.querySelector('.lb-frame').innerHTML = ''; document.body.style.overflow = '';
    if (lbFrom && lbFrom.isConnected) lbFrom.focus();
  }
})();
</script>
</body>
</html>
