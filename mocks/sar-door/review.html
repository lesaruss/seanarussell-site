<title>SeanARussell.com Looks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap">
<style>
/* Layout: a fixed control bar (look tabs, page toggle, prev/next) over one full-height frame that shows the chosen real page. Single light theme by choice (current seanarussell.com colors). */
:root{--ink:#1a1a1a;--paper:#f5f5f5;--white:#fff;--orange:#F69820;--orange-text:#7d4a00;--mute:#4d4d4d;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Montserrat,Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
.bar{background:var(--white);border-bottom:3px solid var(--ink);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{font-weight:900;font-size:16px;letter-spacing:-.02em;white-space:nowrap;margin-right:4px}
.mark i{font-style:normal;color:var(--orange)}
.group{display:flex;gap:6px;flex-wrap:wrap}
.bar button{font-family:inherit;font-weight:800;font-size:13px;padding:8px 12px;border:3px solid var(--ink);border-radius:6px;background:var(--white);color:var(--ink);cursor:pointer;white-space:nowrap}
.bar button[aria-pressed="true"]{background:var(--orange)}
.bar button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.spacer{flex:1}
.count{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:12px;font-weight:600;color:var(--mute);width:100%;margin:0}
.stage{flex:1;min-height:0;position:relative;background:var(--white)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
@media (max-width:700px){.bar{gap:8px}.bar button{padding:7px 9px;font-size:12px}.note,.mark,.spacer{display:none}}
</style>

<div class="bar" role="toolbar" aria-label="Look viewer">
  <span class="mark">Sean A. Russell<i>.</i></span>
  <div class="group" id="looks" aria-label="Looks"></div>
  <div class="group" id="pages" aria-label="Page"></div>
  <span class="spacer"></span>
  <button type="button" id="prev">Previous</button>
  <span class="count" id="count"></span>
  <button type="button" id="next">Next</button>
  <p class="note" id="note"></p>
</div>
<div class="stage"><iframe id="view" title="Look preview"></iframe></div>

<script>
(function(){
  var looks=[
    {slug:'front-page',name:'1 Front Page',note:'You as the cover story. Masthead, cover lines, an issue to read through.'},
    {slug:'liner-notes',name:'2 Liner Notes',note:'Your career as an album. Sleeve, tracklist, "written, produced and built by" credits.'},
    {slug:'showreel',name:'3 Showreel',note:'A live broadcast. On air tally, timecode, lower thirds, rundown menu.'},
    {slug:'blueprint',name:'4 Blueprint',note:'From Blur to Blueprint as a drawing set. Grid paper, callouts, legend.'}
  ];
  var pages=[{id:'index',name:'Front door'},{id:'representation',name:'Representation'}];
  var views=[]; looks.forEach(function(l,li){pages.forEach(function(p,pi){views.push({li:li,pi:pi})})});
  var cur=0;
  var lk=document.getElementById('looks'), pg=document.getElementById('pages');
  looks.forEach(function(l,li){var b=document.createElement('button');b.type='button';b.textContent=l.name;b.onclick=function(){go(li*2+views[cur].pi)};lk.appendChild(b)});
  pages.forEach(function(p,pi){var b=document.createElement('button');b.type='button';b.textContent=p.name;b.onclick=function(){go(views[cur].li*2+pi)};pg.appendChild(b)});
  function go(n,fromHash){
    cur=(n+views.length)%views.length;
    var v=views[cur], l=looks[v.li], p=pages[v.pi];
    var src=l.slug+'/'+p.id+'.html', f=document.getElementById('view');
    if(f.getAttribute('src')!==src) f.setAttribute('src',src);
    [].forEach.call(lk.children,function(b,i){b.setAttribute('aria-pressed',i===v.li)});
    [].forEach.call(pg.children,function(b,i){b.setAttribute('aria-pressed',i===v.pi)});
    document.getElementById('count').textContent=(cur+1)+' of '+views.length;
    document.getElementById('note').textContent=l.note;
    var h='#'+l.slug+'-'+p.id; if(!fromHash && location.hash!==h) location.hash=h;
  }
  function fromHash(){var h=location.hash.slice(1);var k=views.findIndex(function(v){return looks[v.li].slug+'-'+pages[v.pi].id===h});go(k<0?0:k,true)}
  document.getElementById('prev').onclick=function(){go(cur-1)};
  document.getElementById('next').onclick=function(){go(cur+1)};
  document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
  // Links inside a look (front door to Representation and back) stay in the viewer: keep the bar in sync.
  document.getElementById('view').addEventListener('load',function(){
    try{var path=this.contentWindow.location.pathname;var m=path.match(/([a-z-]+)\/(index|representation)\.html$/);
      if(m){var k=views.findIndex(function(v){return looks[v.li].slug===m[1]&&pages[v.pi].id===m[2]}); if(k>=0&&k!==cur){cur=k;go(k)}}}catch(e){}
  });
  window.addEventListener('hashchange',fromHash);
  fromHash();
})();
</script>
